name: Bootstrap source tree

on:
  push:
    branches:
      - feat/go-backend-rewrite
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: contains(github.event.head_commit.message, 'bootstrap: unpack')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part* > /tmp/mrr-go-source.b64
          echo "fc4653d58bb9961f17d9fd930519f37accba662ab2a8cb59060b743189ba7148  /tmp/mrr-go-source.b64" | sha256sum -c -
          base64 --decode /tmp/mrr-go-source.b64 > /tmp/mrr-go-source.tar.gz
          echo "2dba7eeea376cda8a132fd2a9919b2e3ce1ec8ce7e4c7370f214c553e5e3ed31  /tmp/mrr-go-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mrr-go-source.tar.gz -C .
          rm -rf bootstrap

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit"
            exit 0
          fi
          git commit -m "feat: implement Go backend rewrite"
          git push origin HEAD:feat/go-backend-rewrite
